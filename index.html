<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베네치아 · 돌로미티 · 밀라노 10일 — 상세 일정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EEEC; --panel:#F7F9F8; --ink:#1B2A2F; --ink-2:#4A5C62; --ink-3:#8A9AA0; --line:#D3DCDA;
    --venice:#2F5F8F; --east:#3D6E52; --west:#7B8C3A; --milan:#A86A2C; --lugano:#8C3D5A; --warn:#B4452B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}

  .app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:100vh;height:100vh}

  /* rail */
  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .rail-head{padding:26px 22px 14px}
  .rail-head h1{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
  .rail-head p{color:var(--ink-2);font-size:13px;margin-top:6px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 22px 12px}
  .plan-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;line-height:1.3}
  .plan-btn b{display:block;font-size:13px}
  .plan-btn span{display:block;font-size:11px;color:var(--ink-2)}
  .plan-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .plan-btn.active span{color:#C5D1D5}
  .plan-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 22px 12px;font-size:12px;color:var(--ink-2)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .days{overflow-y:auto;flex:1;padding:0 10px 22px}
  .day-btn{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;position:relative}
  .day-btn:hover{background:#EDF2F0}
  .day-btn.active{background:var(--ink);color:#fff}
  .day-btn.active .d-sub{color:#C5D1D5}
  .day-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .d-date{font-weight:700;font-size:14px;line-height:1.3}
  .d-date small{display:block;font-weight:400;font-size:11px;opacity:.7}
  .d-title{font-weight:500;font-size:14px;line-height:1.35}
  .d-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .day-btn::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--c)}
  .util{grid-template-columns:1fr}
  .util::before{display:none}
  .rail-sep{height:1px;background:var(--line);margin:6px 12px 8px}

  /* main */
  .main{display:grid;grid-template-rows:minmax(280px,42%) 1fr;overflow:hidden}
  #map{width:100%;height:100%;background:#DCE5E2}
  .detail{overflow-y:auto;padding:24px 32px 48px}
  .detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
  .detail-head h2{font-size:22px;font-weight:900;letter-spacing:-.01em}
  .detail-head .stay{font-size:13px;color:var(--ink-2)}
  .summary{font-size:14px;color:var(--ink-2);margin:6px 0 14px;max-width:700px}
  .alert{font-size:13.5px;padding:10px 14px;border-left:3px solid var(--warn);background:#FBEFEA;border-radius:0 8px 8px 0;margin:0 0 14px;max-width:700px}
  .alert b{color:var(--warn)}
  .tip{font-size:13.5px;color:var(--ink-2);padding:10px 14px;border-left:3px solid var(--c);background:var(--panel);border-radius:0 8px 8px 0;margin:0 0 20px;max-width:700px}

  .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:28px;align-items:start}
  @media (max-width:1150px){.cols{grid-template-columns:1fr}}

  /* timeline with expandable stops */
  .tl{list-style:none;position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl li{position:relative;padding:0 0 14px}
  .tl li::before{content:"";position:absolute;left:-22px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
  .tl li.stop::before{border-color:var(--c);background:var(--c)}
  .t{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .w{font-size:15px;font-weight:700}
  .w .dur{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px}
  details.card{background:var(--panel);border-radius:10px;border:1px solid var(--line);margin-top:6px}
  details.card summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary::after{content:"펼치기";font-size:12px;color:var(--c);white-space:nowrap}
  details.card[open] summary::after{content:"접기"}
  details.card summary:focus-visible{outline:2px solid var(--ink);border-radius:10px}
  .card-body{padding:0 14px 14px;font-size:13.5px}
  .card-body p{margin:0 0 8px}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
  .kv dt{color:var(--ink-3)}
  .kv dd{color:var(--ink)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--ink-2);margin:2px 4px 0 0}
  .badge.must{background:var(--c);border-color:var(--c);color:#fff}
  .goto{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);border-bottom:1.5px solid var(--c)}
  .goto:hover{color:var(--c)}

  .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:0 0 10px;background:#DCE5E2}
  .ph-wrap{position:relative;margin:0 0 10px}
  .ph-wrap .cred{position:absolute;right:8px;bottom:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
  .ph-miss{display:block;padding:18px 14px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--ink-2);text-decoration:none;margin:0 0 10px;text-align:center}
  .thumb{width:54px;height:40px;object-fit:cover;border-radius:6px;flex:none;background:#DCE5E2}
  details.card summary{align-items:center}
  details.card summary .sm{display:flex;align-items:center;gap:10px;min-width:0}
  .more{font-size:12px;color:var(--c);text-decoration:none;border-bottom:1px solid var(--c)}
  .side h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
  .side section{margin-bottom:22px}
  .moves{list-style:none;font-size:13.5px;border-top:1px solid var(--line)}
  .moves li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .moves li span:last-child{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .plain{font-size:13.5px;color:var(--ink-2)}
  .plain b{color:var(--ink)}
  ul.dots{padding-left:18px;font-size:13.5px;color:var(--ink-2)}
  ul.dots li{margin-bottom:4px}

  /* overview + checklist */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:960px;margin-top:12px}
  .ov{padding:14px 16px;border-radius:10px;background:var(--panel);border:0;border-top:4px solid var(--c);cursor:pointer;text-align:left}
  .ov:hover{background:#fff}
  .ov b{display:block;font-size:14px}
  .ov span{font-size:12px;color:var(--ink-2)}
  .ov em{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:6px}
  .chk{list-style:none;max-width:760px}
  .chk li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
  .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
  .chk label{cursor:pointer}
  .chk small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .chk .when{font-weight:700;color:var(--ink)}
  .chk-h{font-size:14px;font-weight:700;margin:22px 0 4px;color:var(--ink-2)}

  /* leaflet */
  .leaflet-container{font-family:inherit}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
  .pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .leaflet-popup-content-wrapper{border-radius:8px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}
    .rail{border-right:0;border-bottom:1px solid var(--line)}
    .rail-head{padding:18px 16px 10px}
    .legend{padding:0 16px 10px}
    .plans{padding:0 16px 10px}
    .days{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px}
    .day-btn{min-width:140px;grid-template-columns:1fr;padding:10px 12px 10px 14px}
    .d-title,.d-sub{display:none}
    .util{min-width:88px}
    .rail-sep{display:none}
    .main{grid-template-rows:300px auto;height:auto}
    .detail{padding:18px 16px 48px}
    .kv{grid-template-columns:56px 1fr}
  }
  @media (prefers-reduced-motion:no-preference){.day-btn,.ov{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <h1>베네치아 · 돌로미티 · 밀라노</h1>
      <p>2026.10.02 – 10.11 · 10일 · 부모님 동반 · 돌로미티 중심</p>
    </div>
    <div class="plans" id="plans"></div>
    <div class="legend">
      <span style="--c:var(--venice)">베네치아</span>
      <span style="--c:var(--east)">돌로미티 동부</span>
      <span style="--c:var(--west)">돌로미티 서부</span>
      <span style="--c:var(--milan)">밀라노 · 호수</span>
      <span style="--c:var(--lugano)">루가노 · 출국</span>
    </div>
    <nav class="days" id="days"></nav>
  </aside>
  <section class="main">
    <div id="map" role="region" aria-label="여행 경로 지도"></div>
    <div class="detail" id="detail"></div>
  </section>
</div>

/* ---------- map ---------- */
let map=null,layer=null;
try{
  map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([46.1,11.0],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);
  layer=L.layerGroup().addTo(map);
}catch(e){
  document.getElementById('map').innerHTML='<div style="padding:24px;color:#4A5C62;font-size:14px">지도는 인터넷에 연결되어 있을 때 표시됩니다. 아래 일정은 오프라인에서도 볼 수 있어요.</div>';
}
function pin(color,label){return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],html:`<div class="pin" style="background:${color}"><b>${label}</b></div>`});}
function stopsOf(day){const seen=new Set();return day.s.filter(x=>x.p&&!seen.has(x.p)&&seen.add(x.p));}
function draw(i){
  if(!map)return; layer.clearLayers(); const b=[]; let prev=null;
  const days=i===null?DAYS:[DAYS[i]];
  days.forEach(day=>{
    const c=PHASE[day.ph], st=stopsOf(day), pts=st.map(x=>P[x.p].ll);
    if(i===null&&prev)L.polyline([prev,pts[0]],{color:c,weight:2,opacity:.5,dashArray:'4 6'}).addTo(layer);
    L.polyline(pts,{color:c,weight:3,opacity:.85}).addTo(layer);
    st.forEach((x,j)=>{
      L.marker(P[x.p].ll,{icon:pin(c,i===null?day.d.slice(3):String(j+1))})
       .bindPopup(`<b>${P[x.p].n}</b><br>${day.d}(${day.dow}) ${x.t} · ${x.w}`).addTo(layer);
      b.push(P[x.p].ll);
    });
    prev=pts[pts.length-1];
  });
  if(b.length)map.fitBounds(b,{padding:[36,36],maxZoom:i===null?7:12});
}

/* ---------- photos: 직접 지정 → Wikipedia → Wikimedia Commons 검색 → Openverse ---------- */
const PH={};
async function restSummary(lang,title){
  const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if(!r.ok)return null; const j=await r.json();
  if(j.type==='disambiguation')return null;
  const th=j.thumbnail?j.thumbnail.source:null;
  if(!th||/\.(svg|png)(\?|$)/i.test(th))return null;   // 지도·문장(紋章) 같은 그래픽은 건너뜀
  // 원본이 아니라 리사이즈된 썸네일 주소(…/900px-…)를 써야 안정적으로 로드됨
  const big=/\/\d+px-/.test(th)?th.replace(/\/\d+px-/,'/900px-'):th;
  return {src:big,thumb:th,cred:'Wikipedia'};
}
async function commonsSearch(q){
  const u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q+' filetype:bitmap')}&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*`;
  const r=await fetch(u); if(!r.ok)return null; const j=await r.json();
  const pages=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  for(const p of pages){const ii=(p.imageinfo||[])[0]; if(ii&&/^image\/(jpeg|webp)/.test(ii.mime)) return {src:ii.thumburl||ii.url,thumb:ii.thumburl||ii.url,cred:'Wikimedia Commons'};}
  return null;
}
async function openverse(q){
  const u=`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=5&license_type=all-cc&mature=false`;
  const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok)return null; const j=await r.json();
  const it=(j.results||[]).find(x=>x.url&&/\.(jpe?g|webp)$/i.test(x.url)||x.thumbnail);
  return it?{src:it.url,thumb:it.thumbnail||it.url,cred:'Openverse · '+(it.creator||'')}:null;
}
function photoFor(key){
  if(PH[key])return PH[key];
  PH[key]=(async()=>{
    const my=(MY_PHOTOS[key]||'').trim();
    if(my)return {src:my,thumb:my,cred:''};
    const pl=P[key]; const q=pl.it||pl.wk||pl.n; const tries=[];
    if(pl.wk)tries.push(()=>restSummary('en',pl.wk));
    if(pl.it)tries.push(()=>restSummary('it',pl.it));
    tries.push(()=>commonsSearch(q));
    if(pl.wk&&pl.wk!==q)tries.push(()=>commonsSearch(pl.wk));
    tries.push(()=>openverse(q+' Italy'));
    for(const f of tries){ try{const r=await f(); if(r)return r;}catch(e){} }
    return null;
  })();
  return PH[key];
}
function loadPhotos(root){
  root.querySelectorAll('img[data-pk]').forEach(async img=>{
    const key=img.dataset.pk; const p=await photoFor(key);
    if(p){ img.src=img.classList.contains('thumb')?p.thumb:p.src;
      img.onerror=()=>{ if(img.src!==p.thumb){img.src=p.thumb;} else {img.remove();} };
      const c=img.parentElement.querySelector('.cred'); if(c&&p.cred){c.textContent=p.cred;c.hidden=false;} }
    else if(img.classList.contains('thumb')) img.remove();
    else { const w=img.parentElement; w.innerHTML=`<a class="ph-miss" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(P[key].wk||P[key].n)}">사진을 자동으로 찾지 못했어요 — 여기서 검색</a>`; }
  });
}
function select(i){
  nav.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',(i===null?'all':String(i))===b.dataset.i));
  draw(i==='check'?null:i); render(i);
  if(window.innerWidth<=860)document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
}
select(null);
