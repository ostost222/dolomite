<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베네치아 · 돌로미티 · 밀라노 11일 — 상세 일정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EEEC; --panel:#F7F9F8; --ink:#1B2A2F; --ink-2:#4A5C62; --ink-3:#8A9AA0; --line:#D3DCDA;
    --venice:#2F5F8F; --east:#3D6E52; --west:#7B8C3A; --milan:#A86A2C; --lugano:#8C3D5A; --warn:#B4452B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}

  .app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:100vh;height:100vh}

  /* rail */
  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .rail-head{padding:26px 22px 14px}
  .rail-head h1{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
  .rail-head p{color:var(--ink-2);font-size:13px;margin-top:6px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 22px 12px}
  .plan-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;line-height:1.3}
  .plan-btn b{display:block;font-size:13px}
  .plan-btn span{display:block;font-size:11px;color:var(--ink-2)}
  .plan-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .plan-btn.active span{color:#C5D1D5}
  .plan-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 22px 12px;font-size:12px;color:var(--ink-2)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .days{overflow-y:auto;flex:1;padding:0 10px 22px}
  .day-btn{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;position:relative}
  .day-btn:hover{background:#EDF2F0}
  .day-btn.active{background:var(--ink);color:#fff}
  .day-btn.active .d-sub{color:#C5D1D5}
  .day-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .d-date{font-weight:700;font-size:14px;line-height:1.3}
  .d-date small{display:block;font-weight:400;font-size:11px;opacity:.7}
  .d-title{font-weight:500;font-size:14px;line-height:1.35}
  .d-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .day-btn::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--c)}
  .util{grid-template-columns:1fr}
  .util::before{display:none}
  .rail-sep{height:1px;background:var(--line);margin:6px 12px 8px}

  /* main */
  .main{display:grid;grid-template-rows:minmax(280px,42%) 1fr;overflow:hidden}
  #map{width:100%;height:100%;background:#DCE5E2}
  .detail{overflow-y:auto;padding:24px 32px 48px}
  .detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
  .detail-head h2{font-size:22px;font-weight:900;letter-spacing:-.01em}
  .detail-head .stay{font-size:13px;color:var(--ink-2)}
  .summary{font-size:14px;color:var(--ink-2);margin:6px 0 14px;max-width:700px}
  .alert{font-size:13.5px;padding:10px 14px;border-left:3px solid var(--warn);background:#FBEFEA;border-radius:0 8px 8px 0;margin:0 0 14px;max-width:700px}
  .alert b{color:var(--warn)}
  .tip{font-size:13.5px;color:var(--ink-2);padding:10px 14px;border-left:3px solid var(--c);background:var(--panel);border-radius:0 8px 8px 0;margin:0 0 20px;max-width:700px}

  .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:28px;align-items:start}
  @media (max-width:1150px){.cols{grid-template-columns:1fr}}

  /* timeline with expandable stops */
  .tl{list-style:none;position:relative;padding-left:22px}
  .tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl li{position:relative;padding:0 0 14px}
  .tl li::before{content:"";position:absolute;left:-22px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
  .tl li.stop::before{border-color:var(--c);background:var(--c)}
  .t{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .w{font-size:15px;font-weight:700}
  .w .dur{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px}
  details.card{background:var(--panel);border-radius:10px;border:1px solid var(--line);margin-top:6px}
  details.card summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary::after{content:"펼치기";font-size:12px;color:var(--c);white-space:nowrap}
  details.card[open] summary::after{content:"접기"}
  details.card summary:focus-visible{outline:2px solid var(--ink);border-radius:10px}
  .card-body{padding:0 14px 14px;font-size:13.5px}
  .card-body p{margin:0 0 8px}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
  .kv dt{color:var(--ink-3)}
  .kv dd{color:var(--ink)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--ink-2);margin:2px 4px 0 0}
  .badge.must{background:var(--c);border-color:var(--c);color:#fff}
  .goto{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);border-bottom:1.5px solid var(--c)}
  .goto:hover{color:var(--c)}

  .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:0 0 10px;background:#DCE5E2}
  .ph-wrap{position:relative;margin:0 0 10px}
  .ph-wrap .cred{position:absolute;right:8px;bottom:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
  .ph-miss{display:block;padding:18px 14px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--ink-2);text-decoration:none;margin:0 0 10px;text-align:center}
  .thumb{width:54px;height:40px;object-fit:cover;border-radius:6px;flex:none;background:#DCE5E2}
  details.card summary{align-items:center}
  details.card summary .sm{display:flex;align-items:center;gap:10px;min-width:0}
  .more{font-size:12px;color:var(--c);text-decoration:none;border-bottom:1px solid var(--c)}
  .side h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
  .side section{margin-bottom:22px}
  .moves{list-style:none;font-size:13.5px;border-top:1px solid var(--line)}
  .moves li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .moves li span:last-child{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .plain{font-size:13.5px;color:var(--ink-2)}
  .plain b{color:var(--ink)}
  ul.dots{padding-left:18px;font-size:13.5px;color:var(--ink-2)}
  ul.dots li{margin-bottom:4px}

  /* overview + checklist */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:960px;margin-top:12px}
  .ov{padding:14px 16px;border-radius:10px;background:var(--panel);border:0;border-top:4px solid var(--c);cursor:pointer;text-align:left}
  .ov:hover{background:#fff}
  .ov b{display:block;font-size:14px}
  .ov span{font-size:12px;color:var(--ink-2)}
  .ov em{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:6px}
  .chk{list-style:none;max-width:760px}
  .chk li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
  .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
  .chk label{cursor:pointer}
  .chk small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .chk .when{font-weight:700;color:var(--ink)}
  .chk-h{font-size:14px;font-weight:700;margin:22px 0 4px;color:var(--ink-2)}


  /* journey strip (overview) */
  .strip{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}
  .strip .seg{flex:1 1 120px;min-width:120px;padding:10px 12px;border-radius:10px;background:var(--panel);border-left:5px solid var(--c)}
  .strip .seg b{display:block;font-size:14px}
  .strip .seg span{font-size:12px;color:var(--ink-2)}
  .ovlist{list-style:none;max-width:900px}
  .ovlist li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;border-left:4px solid var(--c);background:var(--panel);margin-bottom:6px}
  .ovlist li:hover{background:#fff}
  .ovlist .od{font-weight:700;font-size:14px;line-height:1.3}
  .ovlist .od small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
  .ovlist .ot{font-weight:700;font-size:14px}
  .ovlist .oi{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.5}
  .ovlist .os{font-size:12px;color:var(--ink-3);margin-top:2px}

  /* day summary chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
  .chip.hot{background:#FBEFEA;border-color:#E8C4B8;color:var(--warn);font-weight:700}

  /* stop cards */
  .stops{list-style:none;position:relative;padding-left:0}
  .stop{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:10px}
  .stop .tm{font-size:12.5px;font-weight:700;color:var(--ink-2);padding-top:12px;font-variant-numeric:tabular-nums;text-align:right;padding-right:4px;border-right:2px solid var(--line)}
  .stop.is-stop .tm{border-right-color:var(--c)}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sc-head{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 12px;align-items:center}
  .sc-head .ico{font-size:22px;width:30px;text-align:center}
  .sc-head .thumb{width:76px;height:56px;border-radius:8px}
  .sc-title{font-size:15px;font-weight:700;line-height:1.3}
  .sc-title button{font:inherit;font-weight:700;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;border-bottom:1.5px solid var(--c);text-align:left}
  .sc-title button:hover{color:var(--c)}
  .sc-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
  .sc-sub b{color:var(--ink);font-weight:600}
  .sc-tags{margin-top:5px}
  .sc-body{border-top:1px solid var(--line);padding:10px 12px 12px;font-size:13.5px}
  .sc-body p{margin:0 0 8px}
  .sc details summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--c);padding:6px 12px 8px;font-weight:600}
  .sc details summary::-webkit-details-marker{display:none}
  .sc details summary::after{content:' ▾'}
  .sc details[open] summary::after{content:' ▴'}
  .sc-head.nothumb{grid-template-columns:1fr}
  /* 핵심 / 부수 / 선택 위계 */
  .stop.must .sc{border-left:5px solid var(--c);background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.06)}
  .stop.must .sc-title{font-size:16px;font-weight:800}
  .stop.must .tm{color:var(--ink);font-size:13px}
  .must-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--c);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
  .stop.sub .sc{background:var(--panel)}
  .stop.sub .sc-title{font-size:14px;font-weight:600;color:var(--ink-2)}
  .stop.sub .sc-title button{color:var(--ink-2);border-bottom-color:var(--line)}
  .stop.sub .sc-sub{color:var(--ink-3)}
  .stop.opt .sc{background:transparent;border-style:dashed}
  .stop.opt .sc-title{font-size:13.5px;font-weight:500;color:var(--ink-3)}
  .stop.opt .sc-title button{color:var(--ink-3);border-bottom-color:var(--line)}
  .stop.opt .sc-sub,.stop.opt .tm{color:var(--ink-3)}
  .stop.opt .thumb{opacity:.6}
  .opt-badge{display:inline-block;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
  .ovlist .oi b{color:var(--ink);font-weight:700}
  .ovlist .oi span{color:var(--ink-3)}
  .daynav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0;max-width:760px}
  .daynav button{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px;text-align:left}
  .daynav button:last-child{text-align:right}
  .daynav button:hover{background:#fff}
  .daynav small{display:block;font-size:11px;color:var(--ink-3)}
  @media (max-width:860px){
    .stop{grid-template-columns:44px 1fr;gap:8px}
    .sc-head .thumb{width:60px;height:46px}
    .strip .seg{flex:1 1 45%;min-width:0}
  }
  .rh{font-size:15px;font-weight:800;margin:18px 0 6px}
  .rt{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border-radius:10px;overflow:hidden}
  .rt th{background:#E3E9E7;text-align:left;padding:7px 8px;font-weight:700;font-size:12px}
  .rt td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
  .rt tr.r1 td{background:#fff}
  .rt tr.r1 td:first-child{border-left:4px solid var(--warn)}
  .rt tr.r2 td:first-child{border-left:4px solid var(--milan)}
  .rt.dim{opacity:.7}
  .rt small{color:var(--ink-3)}
  .rpin{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);font-size:11px;display:flex;align-items:center;justify-content:center}
  @media (max-width:860px){.rt{font-size:11.5px}.rt th:nth-child(4),.rt td:nth-child(4),.rt th:nth-child(6),.rt td:nth-child(6){display:none}}
  /* leaflet */
  .leaflet-container{font-family:inherit}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
  .pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
  .pin.big{border-width:3px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .pin.big b{font-size:12px}
  .daylabel{white-space:nowrap;font-size:11px;font-weight:700;background:#fff;border:1.5px solid;border-radius:12px;padding:1px 7px;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none}
  .mapbtn a{width:auto!important;padding:0 10px;font-size:12px;font-weight:700;line-height:30px;color:var(--ink)}
  .leaflet-control-layers{font-size:12px;border-radius:8px}
  .leaflet-control-layers-list label{white-space:nowrap}
  .leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 12px}
  .leaflet-popup-content-wrapper{border-radius:8px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}
    .rail{border-right:0;border-bottom:1px solid var(--line)}
    .rail-head{padding:18px 16px 10px}
    .legend{padding:0 16px 10px}
    .plans{padding:0 16px 10px}
    .days{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px}
    .day-btn{min-width:140px;grid-template-columns:1fr;padding:10px 12px 10px 14px}
    .d-title,.d-sub{display:none}
    .util .d-title{display:block;font-size:13px}
    .util{min-width:88px;display:flex;align-items:center}
    .rail-sep{display:none}
    .main{grid-template-rows:300px auto;height:auto}
    .detail{padding:18px 16px 48px}
    .kv{grid-template-columns:56px 1fr}
  }
  @media (prefers-reduced-motion:no-preference){.day-btn,.ov{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <h1>베네치아 · 돌로미티 · 밀라노</h1>
      <p>2026.10.02 – 10.12 · 11일 · 베네치아 3박 · 트레 크로치 2박 · Cyprianerhof 2박 · 밀라노 3박</p>
    </div>
    <div class="plans" id="plans"></div>
    <div class="legend">
      <span style="--c:var(--venice)">베네치아</span>
      <span style="--c:var(--east)">돌로미티 동부</span>
      <span style="--c:var(--west)">돌로미티 서부</span>
      <span style="--c:var(--milan)">밀라노 · 호수</span>
      <span style="--c:var(--lugano)">출국</span>
    </div>
    <nav class="days" id="days"></nav>
  </aside>
  <section class="main">
    <div id="map" role="region" aria-label="여행 경로 지도"></div>
    <div class="detail" id="detail"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

/* =========================================================
   직접 사진 넣기 — 아래 따옴표 안에 이미지 주소를 붙여넣으세요.
   비워두면 위키피디아에서 자동으로 찾습니다.
   예) misur:'https://example.com/misurina.jpg',
   GitHub에 올린 사진이면 상대경로도 됩니다: trecime:'img/trecime.jpg',
   ========================================================= */
const MY_PHOTOS={
  vce:'', mestre:'', slucia:'', marco:'', rialto:'',
  misur:'', trecime:'', cortina:'', braies:'', dobbi:'', falz:'', torri:'',
  gardena:'', seceda:'', ortisei:'', siusi:'', bolzano:'', carezza:'',
  riva:'', centrale:'', duomo:'', sforza:'', brera:'', como:'', bellagio:'', navigli:'',
  lugano:'', mxp:''
};
const PHASE={venice:'#2F5F8F',east:'#3D6E52',west:'#7B8C3A',milan:'#A86A2C',lugano:'#8C3D5A'};

const P={
  vce:{n:'베네치아 마르코 폴로 공항',ll:[45.5047,12.3466],wk:'Venice Marco Polo Airport',it:"Aeroporto di Venezia-Tessera"},
  mestrest:{n:'Sixt 메스트레역 (Viale Stazione 10, Saba 주차장)',ll:[45.4822,12.2336],wk:'Venezia Mestre railway station',it:"Stazione di Venezia Mestre"},
  mestre:{n:'Filzi Luxe Stay Venice (메스트레, 역에서 도보 20분)',ll:[45.4760,12.2350],wk:'Mestre',it:"Mestre"},
  slucia:{n:'베네치아 산타 루치아역',ll:[45.4410,12.3210],wk:'Venezia Santa Lucia railway station',it:"Stazione di Venezia Santa Lucia"},
  ducale:{n:'두칼레 궁전',ll:[45.4337,12.3403],wk:"Doge's Palace",it:"Palazzo Ducale (Venezia)"},
  accademia:{n:'아카데미아 미술관',ll:[45.4313,12.3283],wk:'Gallerie dell\'Accademia',it:"Gallerie dell'Accademia"},
  guggenheim:{n:'페기 구겐하임 컬렉션',ll:[45.4308,12.3315],wk:'Peggy Guggenheim Collection',it:"Collezione Peggy Guggenheim"},
  grassi:{n:'팔라초 그라시',ll:[45.4335,12.3305],wk:'Palazzo Grassi',it:"Palazzo Grassi"},

{d:'10/06',dow:'화',ph:'east',sun:'일출 07:22 · 일몰 18:40',title:'트레치메(아침) · 브라이에스 보트',stay:'B&B Hotel Passo Tre Croci (동부 2/2박) · 조식만',mode:'렌터카',
 sum:'딱 두 곳. 조식 후 유료도로로 아우론초 산장에 올라 아침 햇빛이 정면으로 드는 트레치메를 한산하게 보고, 브라이에스로 넘어가 호숫가 점심·보트·산책으로 오후를 느긋하게. 돌아오는 길에 코르티나에서 저녁. 숙소 → 동쪽 → 북쪽 → 남쪽 → 숙소 삼각형 동선.',
 alert:'<b>트레치메 유료도로는 온라인 주차 예약 없이 진입 불가.</b> 2026년 승용차 €40(12시간), 10월 블록 오픈 대기(auronzo.info). <b>08:00~08:30 입장 슬롯</b>. 아우론초 산장 카페 08:30 오픈. 아침 2,333m는 체감 0℃ 안팎. 예비: 미주리나발 셔틀버스(~10/11).',
 tip:'숙소 07:00 조식 → 07:30 출발 → 미주리나 통과(15분) → 유료도로 → 08:15 산장. 주차장 앞이 전망대, 걷지 않아도 됨. 브라이에스 보트는 예약 불가·현금, 9~10월 10:00~17:00(운영 여부 현장 확인). 브라이에스 차량 통제는 9/15에 끝나 P4까지 진입 가능. 도비아코·란드로 호수는 가는 길·오는 길에 창밖으로 보이고, 원하면 5분 정차.',
 s:[
  {t:'07:30',w:'숙소 출발 → 미주리나 통과 → 유료도로',p:'misur',dur:'45분',d:'<p>고개에서 미주리나 15분(어제 저녁에 봤으니 통과), 유료도로 입구 직전 안토르노 호수는 창밖으로. 유료도로 20분.</p>',tags:['걷기 없음']},
  {t:'08:15',w:'트레치메 — 아우론초 산장 전망 (아침)',p:'trecime',dur:'2시간',d:'<p>아우론초 산장(2,333m). 08:30 카페 오픈, 테라스에서 아침 커피·스트루델. 세 봉우리 남벽에 아침 빛이 정면으로 들어와 하루 중 가장 좋은 각도, 사람도 거의 없음. 원하면 라바레도 산장까지 평탄 왕복 1시간.</p>',info:{요금:'€40 / 12h, 예약 필수 (08:00~08:30 슬롯)',산장:'08:30~17:00'},tags:['예약 필수','방풍·보온','아침 추천']},
  {t:'10:15',w:'하산 → 카르보닌 → 도비아코 → 브라이에스',dur:'1시간 15분',d:'<p>미주리나 → 카르보닌 → 란드로 계곡(도로변 란드로 호수·크리스탈로, 창밖) → 도비아코 → 브라이에스 계곡. 도비아코 호수 옆을 지나니 원하면 5분 정차.</p>'},
  {t:'11:30',w:'브라이에스 호수 — 호숫가 점심 · 보트 · 산책',p:'braies',dur:'3.5시간',d:'<p>해발 1,496m. 점심은 호숫가 호텔 레스토랑, 또는 가는 길 도비아코 <b>Eirisch Grill</b>(수제버거 4.7, 11:30~, 화요일 영업)에서 먹고 들어와도 됨. 이후 보트하우스에서 노 젓는 보트 30~60분 — 호수 가운데서 크로다 델 베코를 올려다보기. 이후 보트하우스 앞 대표컷, 동쪽 호숫가 평탄 산책 30분, 카페. 서두를 것 없이 오후를 여기서.</p>',info:{보트:'30분 €19 / 60분 €29, 현금, ~17:00',주차:'P4 유료(3시간 €15) 또는 P3 €12/일',통제:'10월엔 없음'},tags:['보트','평지']},
  {t:'15:00',w:'브라이에스 → 란드로 호수 Restaurant Dürrensee (간식)',p:'landro',dur:'1시간 15분',d:'<p>도비아코 → 란드로 계곡(SS51) 30분. 호수 앞 <b>Restaurant Dürrensee</b>(09~17시, 화요일 영업) 테라스에서 카이저슈마렌·커피, 크리스탈로 조망. 4.3(2,128).</p>',info:{'간식':'Dürrensee 15:30~16:00'},tags:['식당']},
  {t:'16:30',w:'코르티나 저녁 산책',p:'cortina',dur:'2.5시간',d:'<p>란드로에서 30분. 어제 못 본 쪽: 피아차 디보나와 골목, 성당 앞 광장에서 토파네 노을(18:40). Cooperativa 위층 기념품.</p>'},
  {t:'19:00',w:'저녁 — Al Camin (예약)',p:'cortina',dur:'1.5시간',d:'<p>알베라 99, 시내에서 차 5분·주차 소규모. 코르티나 최고 평점 향토 요리(비트 라비올리·사슴·스테이크), 4.6(807), 화요일 19:00~. 대안: <b>5 Torri</b>(피자·파스타, 18:30~, 시내), 특별히 하려면 <b>Tivoli</b>(미슐랭, 19:00~, 예약 필수). 피곤하면 숙소 앞 <b>Baita Son Zuogo</b>로 직행(브라이에스 → 카르보닌 50분).</p>',info:{'1순위':'Al Camin 19:00 예약',대안:'5 Torri 18:30 · Tivoli(미슐랭) · Son Zuogo(숙소 앞)'},tags:['식당','예약 권장']},

  {t:'16:15',w:'Cyprianerhof 체크인 · 사우나 · 온수풀 · 저녁',p:'cyprian',dur:'',d:'<p>시우시에서 20분. 로젠가르텐 정면의 리조트. 짐 풀고 사우나월드·야외 온수풀, 오후 간식, 18:30 전후 로젠가르텐 노을, 19:00 저녁(3/4 보드). 내일 오전은 리조트에서.</p>',info:{식사:'조식·오후 간식·저녁 포함'},tags:['리조트 시간']}

function pin(color,label,big){const sz=big?28:22;return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz],popupAnchor:[0,-sz+2],html:`<div class="pin ${big?'big':''}" style="background:${color};width:${sz}px;height:${sz}px"><b>${label}</b></div>`});}
function dayLabel(text,color){return L.divIcon({className:'',iconSize:[0,0],iconAnchor:[-14,26],html:`<div class="daylabel" style="border-color:${color};color:${color}">${text}</div>`});}
function stopsOf(day){const seen=new Set();return day.s.filter(x=>x.p&&!seen.has(x.p)&&seen.add(x.p));}
let allBounds=[];
function fitAll(){ if(map&&allBounds.length) map.fitBounds(allBounds,{padding:[30,30],maxZoom:8}); }
function drawBase(){
  if(!map)return; baseLayer.clearLayers(); allBounds=[]; let prev=null;
  DAYS.forEach((day,di)=>{
    const c=PHASE[day.ph], st=stopsOf(day), pts=st.map(x=>P[x.p].ll); if(!pts.length)return;
    if(prev)L.polyline([prev,pts[0]],{color:'#9AA8AC',weight:2,opacity:.6,dashArray:'4 6',interactive:false}).addTo(baseLayer);
    L.polyline(pts,{color:'#9AA8AC',weight:3,opacity:.7,interactive:false}).addTo(baseLayer);
    st.forEach((x,j)=>{
      const m=L.circleMarker(P[x.p].ll,{radius:5,color:'#fff',weight:1.5,fillColor:c,fillOpacity:.85}).addTo(baseLayer);
      m.bindTooltip(`${day.d}(${day.dow}) · ${P[x.p].n}`,{direction:'top',offset:[0,-4]});
      m.on('click',()=>select(di));
      if(j===0) L.marker(P[x.p].ll,{icon:dayLabel(day.d.slice(3)+'일',c),interactive:false}).addTo(baseLayer);
      allBounds.push(P[x.p].ll);
    });
    prev=pts[pts.length-1];
  });
}
function restoIcon(pick){const c=pick==='1순위'?'#B4452B':pick==='대안'?'#A86A2C':'#8A9AA0';return L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-10],html:`<div class="rpin" style="background:${c}">🍽</div>`});}
function drawResto(dayFilter){
  if(!map)return; hiLayer.clearLayers(); const b=[];
  RESTO.filter(r=>dayFilter?r.day.includes(dayFilter):r.day!=='—').forEach(r=>{
    L.marker(r.ll,{icon:restoIcon(r.pick),zIndexOffset:900}).bindPopup(`<b>${r.n}</b><br>${r.area}<br>${r.meal?r.day+' '+r.meal+' · ':''}${r.pick}<br><span style="color:#666">${r.hrs}</span><br>${r.type} · ★${r.rt}`).addTo(hiLayer); b.push(r.ll);
  });
  if(!dayFilter&&b.length) map.fitBounds(b,{padding:[40,40],maxZoom:10});
}
function draw(i){
  if(!map)return; hiLayer.clearLayers();
  if(i===null){ fitAll(); return; }
  const day=DAYS[i], c=PHASE[day.ph], st=stopsOf(day), pts=st.map(x=>P[x.p].ll), b=[];
  // 이전 날 마지막 지점에서 오는 연결선도 강조(점선)
  const prevDay=DAYS[i-1]; if(prevDay){const ps=stopsOf(prevDay); if(ps.length&&pts.length) L.polyline([P[ps[ps.length-1].p].ll,pts[0]],{color:c,weight:3,opacity:.5,dashArray:'5 7'}).addTo(hiLayer);}
  L.polyline(pts,{color:'#fff',weight:8,opacity:.9}).addTo(hiLayer);
  L.polyline(pts,{color:c,weight:4,opacity:1}).addTo(hiLayer);
  st.forEach((x,j)=>{
    L.marker(P[x.p].ll,{icon:pin(c,String(j+1),true),zIndexOffset:1000})
     .bindPopup(`<b>${P[x.p].n}</b><br>${day.d}(${day.dow}) ${x.t} · ${x.w}`).addTo(hiLayer);
    b.push(P[x.p].ll);
  });
  RESTO.filter(r=>r.day.includes(day.d)&&r.pick!=='제외').forEach(r=>{L.marker(r.ll,{icon:restoIcon(r.pick),zIndexOffset:900}).bindPopup(`<b>🍽 ${r.n}</b><br>${r.meal} · ${r.pick}<br><span style="color:#666">${r.hrs}</span>`).addTo(hiLayer);});
  if(b.length) map.fitBounds(b,{padding:[50,50],maxZoom:11});
}

function tags(a,c){return a?`<div>${a.map(t=>`<span class="badge ${/필수/.test(t)?'must':''}">${t}</span>`).join('')}</div>`:'';}
const MUST=new Set(['trecime','torri','falz','braies','misur','seceda','siusi','seisbahn','pordoi','carezza','qcterme','giau','funes','marco','ducale','gondola','accademia','guggenheim','grassi','burano','duomo','bellagio']);
function levelOf(x){ if(x.k)return x.k; if((x.tags||[]).some(t=>/^선택$/.test(t))||/^\(선택\)/.test(x.w))return 'opt'; if(x.p&&MUST.has(x.p))return 'must'; return 'sub'; }
function iconOf(x){
  const k=x.p||'', w=x.w||'';
  if(/qcterme/.test(k)||/온천|Terme/.test(w))return '♨️';
  if(/torri|falz|seceda|siusi|sella|gardena/.test(k)||/케이블카|곤돌라|리프트|푸니쿨라/.test(w))return '🚡';
  if(/misur|braies|dobbi|landro|carezza|riva|bellagio|comocity|lugano|burano|murano/.test(k)||/호수/.test(w))return '🏞️';
  if(/페리|바포레토/.test(w))return '⛴️';
  if(/체크인|체크아웃|숙소/.test(w))return '🏨';
  if(/공항|Sixt|반납|Express/.test(w))return '✈️';
  if(/출발|→|이동|드라이브/.test(w))return '🚗';
  if(/점심|저녁|브런치|아페리티보/.test(w))return '🍽️';
  if(/두오모|성당|갤러리아|성 |광장|거리|지구|산책/.test(w))return '🏛️';
  return '📍';
}
function dayChips(d){
  const lifts=d.s.filter(x=>iconOf(x)==='🚡').length;
  const musts=d.s.filter(x=>(x.tags||[]).some(t=>/필수/.test(t))).length;
  const lakes=d.s.filter(x=>iconOf(x)==='🏞️').length;
  const first=d.s[0]?d.s[0].t:'';
  const walk=d.s.some(x=>(x.tags||[]).some(t=>/트레킹/.test(t)))?'걷기 보통':(d.s.some(x=>(x.tags||[]).some(t=>/평지/.test(t)))?'걷기 평지만':'걷기 거의 없음');
  const mustN=d.s.filter(x=>levelOf(x)==='must').length;
  return `<div class="chips"><span class="chip">🕖 출발 ${first}</span>${mustN?`<span class="chip" style="font-weight:700;color:var(--ink)">★ 핵심 ${mustN}곳</span>`:''}${lifts?`<span class="chip">🚡 리프트 ${lifts}개</span>`:''}${lakes?`<span class="chip">🏞️ 호수·물가 ${lakes}곳</span>`:''}<span class="chip">🚶 ${walk}</span><span class="chip">🚗 이동 ${d.m.length}구간</span>${musts?`<span class="chip hot">🎫 예약 필수 ${musts}</span>`:''}</div>`;
}
function stopCard(x,c){
  const has=x.p, name=has?P[x.p].n:'';
  const infoEntries=x.info?Object.entries(x.info):[];
  const headInfo=infoEntries.slice(0,2).map(([k,v])=>`<b>${k}</b> ${v}`).join(' · ');
  const moreInfo=infoEntries.slice(2);
  const body=(x.d||'')+kv(moreInfo.length?Object.fromEntries(moreInfo):null)+(x.alt?`<p><b>대안</b> ${x.alt}</p>`:'')+(has?`<p><a class="more" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(P[x.p].wk||P[x.p].n)}">사진 더 보기</a></p>`:'');
  const hasBody=(x.d||moreInfo.length||x.alt);
  const lv=levelOf(x);
  return `<li class="stop ${has?'is-stop':''} ${lv}"><div class="tm">${x.t}</div>
   <div class="sc"><div class="sc-head ${has?'':'nothumb'}">
     ${has?`<img class="thumb" data-pk="${x.p}" alt="">`:''}
     <div><div class="sc-title">${lv==='must'?'<span class="must-badge">핵심</span>':lv==='opt'?'<span class="opt-badge">선택</span>':''}${iconOf(x)} ${has?`<button class="goto" data-p="${x.p}">${x.w.replace(/^\(선택\)\s*/,'')}</button>`:x.w.replace(/^\(선택\)\s*/,'')}${x.dur?`<span class="dur"> · ${x.dur}</span>`:''}</div>
     <div class="sc-sub">${has&&name!==x.w?name:''}${headInfo?(has&&name!==x.w?' · ':'')+headInfo:''}</div>
     ${(x.tags&&x.tags.length)?`<div class="sc-tags">${tags(x.tags)}</div>`:''}</div>
   </div>
   ${hasBody?`<details><summary>자세히</summary><div class="sc-body">${has?`<div class="ph-wrap"><img class="ph" data-pk="${x.p}" alt="${name}"><span class="cred" hidden></span></div>`:''}${body}</div></details>`:''}
   </div></li>`;
}
function render(i){
  if(i==='food'){
    const used=RESTO.filter(r=>r.day!=='—'), rest=RESTO.filter(r=>r.day==='—');
    const days=[...new Set(used.map(r=>r.day))];
    const row=r=>`<tr class="${r.pick==='1순위'?'r1':r.pick==='대안'?'r2':''}"><td><button class="goto rgoto" data-ll="${r.ll.join(',')}">${r.n}</button><br><small>${r.area}</small></td><td>${r.meal}</td><td><b>${r.pick}</b></td><td>${r.type}</td><td>${r.hrs}</td><td>${r.rt}</td><td>${r.why}</td></tr>`;
    detail.innerHTML=`<div class="detail-head"><h2>맛집 배치 — 날짜별</h2><span class="stay">My Maps 30곳을 요일별 영업시간·동선에 맞춰 배치. 이름을 누르면 지도에서 위치 확인.</span></div>
    <p style="margin:8px 0 14px"><a class="more" target="_blank" rel="noopener" href="https://www.google.com/maps/d/viewer?mid=1YuDDCQ2Nvdo5soXUOR4LcHxJ1LpAZjtr&ll=46.5387,12.1359&z=9">원본 Google My Maps 열기 ↗</a></p>
    ${days.map(d=>`<h3 class="rh">${d}</h3><table class="rt"><thead><tr><th>식당</th><th>끼니</th><th>선택</th><th>메뉴</th><th>영업시간</th><th>평점</th><th>비고</th></tr></thead><tbody>${used.filter(r=>r.day===d).map(row).join('')}</tbody></table>`).join('')}
    <h3 class="rh" style="color:var(--ink-3)">동선 밖 · 이번엔 제외</h3><table class="rt dim"><thead><tr><th>식당</th><th></th><th></th><th>메뉴</th><th>영업시간</th><th>평점</th><th>이유</th></tr></thead><tbody>${rest.map(row).join('')}</tbody></table>`;
    detail.querySelectorAll('.rgoto').forEach(b=>b.addEventListener('click',()=>{const ll=b.dataset.ll.split(',').map(Number); if(!map)return; map.flyTo(ll,14,{duration:.8}); hiLayer.eachLayer(l=>{if(l.getLatLng&&Math.abs(l.getLatLng().lat-ll[0])<1e-4&&Math.abs(l.getLatLng().lng-ll[1])<1e-4)l.openPopup();});}));
    drawResto();
    return;
  }
  if(i==='check'){
    detail.innerHTML=`<div class="detail-head"><h2>예약 · 준비 체크리스트</h2><span class="stay">체크 상태는 이 브라우저에서만 저장됩니다</span></div>`+
     CHECK.map((g,gi)=>`<div class="chk-h">${g.h}</div><ul class="chk">${g.items.map((it,k)=>{const id=`${PLANS[planIdx].id}_c${gi}_${k}`;return`<li><input type="checkbox" id="${id}"><label for="${id}">${it.w}${it.when?` <span class="when">· ${it.when}</span>`:''}${it.s?`<small>${it.s}</small>`:''}</label></li>`;}).join('')}</ul>`).join('');
    detail.querySelectorAll('input').forEach(c=>{try{c.checked=localStorage.getItem('trip_'+c.id)==='1';c.addEventListener('change',()=>localStorage.setItem('trip_'+c.id,c.checked?'1':'0'));}catch(e){}});
    return;
  }
  if(i===null){
    // 숙박 구간 띠
    const segs=[]; DAYS.forEach((d,k)=>{const key=d.stay.replace(/\s*\(.*$/,''); if(!key||key==='—')return; const last=segs[segs.length-1]; if(last&&last.key===key){last.n++;last.to=k;} else segs.push({key,n:1,from:k,to:k,ph:d.ph});});
    detail.innerHTML=`<div class="detail-head"><h2>전체 일정 한눈에</h2><span class="stay">날짜를 누르면 그날 상세 · 지도의 회색 점을 눌러도 이동</span></div>
    <div class="strip">${segs.map(g=>`<div class="seg" style="--c:${PHASE[g.ph]}"><b>${g.n}박 · ${g.key}</b><span>${DAYS[g.from].d}${g.n>1?' ~ '+DAYS[g.to].d:''}</span></div>`).join('')}</div>
    <ul class="ovlist">${DAYS.map((d,k)=>{const hl=d.s.filter(x=>x.p&&iconOf(x)!=='🏨'&&iconOf(x)!=='🚗'&&levelOf(x)!=='opt').sort((a,b)=>(levelOf(a)==='must'?0:1)-(levelOf(b)==='must'?0:1)).slice(0,4).map(x=>{const t=iconOf(x)+' '+(x.w.replace(/^\(선택\)\s*/,'').length>16?x.w.replace(/^\(선택\)\s*/,'').slice(0,16)+'…':x.w.replace(/^\(선택\)\s*/,''));return levelOf(x)==='must'?`<b>${t}</b>`:`<span>${t}</span>`;}).join('  ·  ');
      return `<li data-i="${k}" style="--c:${PHASE[d.ph]}"><div class="od">${d.d}<small>${d.dow}요일</small></div><div><div class="ot">${d.title}</div><div class="oi">${hl}</div><div class="os">🏨 ${d.stay} · ${d.mode}</div></div></li>`;}).join('')}</ul>`;
    detail.querySelectorAll('.ovlist li').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.i)));
    return;
  }
  const d=DAYS[i],c=PHASE[d.ph], prev=DAYS[i-1], next=DAYS[i+1];
  detail.innerHTML=`
   <div class="detail-head"><h2>${d.d} (${d.dow}) ${d.title}</h2><span class="stay">🏨 ${d.stay}</span>${d.sun?`<span class="stay">☀ ${d.sun}</span>`:''}</div>
   ${dayChips(d)}
   <p class="summary">${d.sum}</p>
   ${d.alert?`<div class="alert">${d.alert}</div>`:''}
   <div class="tip" style="--c:${c}">${d.tip}</div>
   <div class="cols" style="--c:${c}">
    <ul class="stops">${d.s.map(x=>stopCard(x,c)).join('')}</ul>
    <div class="side">
     <section><h3>🚗 이동 구간</h3><ul class="moves">${d.m.map(([a,b])=>`<li><span>${a}</span><span>${b}</span></li>`).join('')}</ul><p class="plain" style="margin-top:8px"><b>수단</b> ${d.mode}</p></section>
     <section><h3>🍽️ 이 지역 먹을 것</h3><ul class="dots">${d.food.map(f=>`<li>${f}</li>`).join('')}</ul></section>
     <section><h3>🎒 챙길 것 · 주의</h3><ul class="dots">${d.pack.map(f=>`<li>${f}</li>`).join('')}</ul></section>
     ${d.extra&&d.extra.length?`<section><h3>⏱ 시간·체력이 남으면</h3><ul class="dots">${d.extra.map(f=>`<li>${f}</li>`).join('')}</ul></section>`:''}
    </div>
   </div>
   <div class="daynav">${prev?`<button data-i="${i-1}"><small>← 이전 날</small>${prev.d} ${prev.title}</button>`:'<span></span>'}${next?`<button data-i="${i+1}"><small>다음 날 →</small>${next.d} ${next.title}</button>`:'<span></span>'}</div>`;
  detail.querySelectorAll('.daynav button').forEach(b=>b.addEventListener('click',()=>{select(+b.dataset.i);detail.scrollTop=0;}));
  loadPhotos(detail);
  detail.querySelectorAll('.goto').forEach(b=>b.addEventListener('click',()=>{
    const ll=P[b.dataset.p].ll; if(!map)return; map.flyTo(ll,13,{duration:.8});
    hiLayer.eachLayer(l=>{if(l.getLatLng&&l.getLatLng().lat===ll[0]&&l.getLatLng().lng===ll[1])l.openPopup();});
  }));
}
/* ---------- photos: 직접 지정 → Wikipedia → Wikimedia Commons 검색 → Openverse ---------- */
const PH={};
async function restSummary(lang,title){
  const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if(!r.ok)return null; const j=await r.json();
  if(j.type==='disambiguation')return null;
  const th=j.thumbnail?j.thumbnail.source:null;
  if(!th||/\.(svg|png)(\?|$)/i.test(th))return null;   // 지도·문장(紋章) 같은 그래픽은 건너뜀
  // 원본이 아니라 리사이즈된 썸네일 주소(…/900px-…)를 써야 안정적으로 로드됨
  const big=/\/\d+px-/.test(th)?th.replace(/\/\d+px-/,'/900px-'):th;
  return {src:big,thumb:th,cred:'Wikipedia'};
}
async function commonsSearch(q){
  const u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q+' filetype:bitmap')}&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*`;
  const r=await fetch(u); if(!r.ok)return null; const j=await r.json();
  const pages=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  for(const p of pages){const ii=(p.imageinfo||[])[0]; if(ii&&/^image\/(jpeg|webp)/.test(ii.mime)) return {src:ii.thumburl||ii.url,thumb:ii.thumburl||ii.url,cred:'Wikimedia Commons'};}
  return null;
}
async function openverse(q){
  const u=`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=5&license_type=all-cc&mature=false`;
  const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok)return null; const j=await r.json();
  const it=(j.results||[]).find(x=>x.url&&/\.(jpe?g|webp)$/i.test(x.url)||x.thumbnail);
  return it?{src:it.url,thumb:it.thumbnail||it.url,cred:'Openverse · '+(it.creator||'')}:null;
}
function photoFor(key){
  if(PH[key])return PH[key];
  PH[key]=(async()=>{
    const my=(MY_PHOTOS[key]||'').trim();
    if(my)return {src:my,thumb:my,cred:''};
    const pl=P[key]; const q=pl.it||pl.wk||pl.n; const tries=[];
    if(pl.wk)tries.push(()=>restSummary('en',pl.wk));
    if(pl.it)tries.push(()=>restSummary('it',pl.it));
    tries.push(()=>commonsSearch(q));
    if(pl.wk&&pl.wk!==q)tries.push(()=>commonsSearch(pl.wk));
    tries.push(()=>openverse(q+' Italy'));
    for(const f of tries){ try{const r=await f(); if(r)return r;}catch(e){} }
    return null;
  })();
  return PH[key];
}
function loadPhotos(root){
  root.querySelectorAll('img[data-pk]').forEach(async img=>{
    const key=img.dataset.pk; const p=await photoFor(key);
    if(p){ img.src=img.classList.contains('thumb')?p.thumb:p.src;
      img.onerror=()=>{ if(img.src!==p.thumb){img.src=p.thumb;} else {img.remove();} };
      const c=img.parentElement.querySelector('.cred'); if(c&&p.cred){c.textContent=p.cred;c.hidden=false;} }
    else if(img.classList.contains('thumb')) img.remove();
    else { const w=img.parentElement; w.innerHTML=`<a class="ph-miss" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(P[key].wk||P[key].n)}">사진을 자동으로 찾지 못했어요 — 여기서 검색</a>`; }
  });
}
function select(i){
  nav.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',(i===null?'all':String(i))===b.dataset.i));
  draw((i==='check'||i==='food')?null:i); render(i);
  if(window.innerWidth<=860)document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
}
drawBase();
select(null);
</script>
